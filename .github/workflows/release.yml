name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    uses: konradmichalik/reusable-github-actions/.github/workflows/release.yml@c460c0166a646cb65fd059c8d2f7d895ff3c787b # 0.1.0

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Publish annotaitr to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install opencode plugin dependencies
        run: npm ci
        working-directory: apps/opencode

      - name: Build opencode plugin
        run: npm run build
        working-directory: apps/opencode

      - name: Publish annotaitr-opencode to npm
        run: npm publish --access public
        working-directory: apps/opencode
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
